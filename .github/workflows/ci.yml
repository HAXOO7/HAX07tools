name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  # 1. 单元测试与网页构建
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build

  # 2. Playwright 自动化测试
  e2e-test:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # 3. 自动更新多语言覆盖率
  update-i18n-readme:
    name: Update i18n Coverage in README
    runs-on: ubuntu-latest

    needs:
      - test-and-build

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for locale changes
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: public/locales/**

      - name: Generate coverage table
        if: steps.changed.outputs.any_changed == 'true'
        run: node scripts/i18n-coverage.js

      - name: Create Pull Request
        if: steps.changed.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update i18n coverage table"
          title: "chore: update i18n coverage table"
          body: "Auto-generated update to the i18n coverage table in README.md."
          branch: "chore/i18n-coverage-update"
          base: main
          delete-branch: true
